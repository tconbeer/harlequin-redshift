[project]
name = "harlequin-redshift"
version = "0.1.0"
description = "A Harlequin adapter for Amazon Redshift."
authors = [
    { name = "Ted Conbeer", email = "tconbeer@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2.11 is the first version with CatalogSearchResult, which search_catalog returns
    "harlequin>=2.11,<3",
    "redshift-connector>=2.1,<3",
]

[project.entry-points."harlequin.adapter"]
redshift = "harlequin_redshift:HarlequinRedshiftAdapter"

[dependency-groups]
dev = [
    "harlequin==2.11.0",
    "ruff>=0.5,<1",
    "pytest>=7.4.3,<10",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.5.0,<4",
    "pyinstrument>=4.6.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harlequin_redshift"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src/**/*.py", "tests/**/*.py"]
mypy_path = "src:stubs"
show_column_numbers = true
follow_imports = "normal"
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
strict_optional = true
warn_return_any = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
# the driver is typed, but its package re-exports Connection/Cursor implicitly
module = "redshift_connector.*"
implicit_reexport = true
